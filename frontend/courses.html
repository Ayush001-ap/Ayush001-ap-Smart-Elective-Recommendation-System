<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Catalog | Elective Hub</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body class="courses-page" style="background: var(--bg); overflow: hidden;">
  <div class="courses-layout" style="display: grid; grid-template-columns: 280px 1fr; height: 100vh;">
    
    <aside class="courses-sidebar" style="background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; backdrop-filter: var(--glass-blur);">
      <div class="sidebar-header" style="margin-bottom: 2rem;">
        <div class="sidebar-brand" style="display: flex; align-items: center; gap: 0.8rem;">
          <div class="brand-icon" style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; display: grid; place-items: center;">
            <span class="material-icons">library_books</span>
          </div>
          <div class="brand-text">
            <h2 style="margin: 0; font-size: 1.2rem; font-family: 'Outfit', sans-serif;">Elective Hub</h2>
            <p style="margin: 0; font-size: 0.8rem; color: var(--muted);">Course Catalog</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <a class="nav-item active" href="#" id="back-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), transparent); color: var(--primary); font-weight: 600; text-decoration: none; border: 1px solid var(--border);">
          <span class="material-icons">arrow_back</span>
          <span>Back to Dashboard</span>
        </a>
      </nav>

      <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto; border-top: 1px solid var(--border); padding-top: 1.5rem;">
        <button id="theme-toggle" class="sidebar-action" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: 0.2s;">
          <span class="material-icons">dark_mode</span>
          <span>Toggle Theme</span>
        </button>
        <button id="logout" class="sidebar-action danger" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.2); color: var(--danger); font-weight: 600; cursor: pointer; transition: 0.2s;">
          <span class="material-icons">logout</span>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="courses-main" style="overflow-y: auto; padding: 2rem 3rem;">
      <div class="courses-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
        <div>
          <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Course Catalog</h1>
          <p class="muted" style="font-size: 1.1rem; margin: 0;">Browse all available courses for elective selection</p>
        </div>
      </div>

      <div class="courses-content">
        <div id="courses" class="courses-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
          <!-- Course cards injected by JS -->
        </div>
      </div>
    </main>
  </div>

  <style>
    /* Styling JS injected elements */
    .course-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1);
      border-color: var(--primary);
    }
    .course-card h3 { margin: 0 0 0.5rem; font-size: 1.3rem; }
    .course-card p { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; line-height: 1.5; flex: 1; }
    
    .chip {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin: 0.25rem 0.25rem 0 0;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }
    
    /* Specific styling for course actions */
    .course-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .course-actions button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      border-radius: 8px;
    }
  </style>

  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/courses.js"></script>
</body>
</html>
