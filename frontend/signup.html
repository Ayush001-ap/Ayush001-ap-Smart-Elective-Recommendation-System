<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Elective Hub</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body style="display: grid; place-items: center; min-height: 100vh; padding: 2rem;">
  <div style="width: 100%; max-width: 520px; position: relative; z-index: 1;">
    
    <button id="theme-toggle" class="theme-toggle"></button>
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="./index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none;">
        <span class="material-icons" style="font-size: 2rem;">auto_graph</span>
        Elective Hub
      </a>
    </div>

    <div class="card" style="padding: 2.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="auth-header" style="text-align: center;">
        <div class="auth-logo" style="width: 48px; height: 48px; border-radius: 12px; background: rgba(79, 70, 229, 0.1); color: var(--primary); display: inline-grid; place-items: center; margin-bottom: 1rem;">
          <span class="material-icons">person_add</span>
        </div>
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Account</h1>
        <p class="muted" style="margin: 0;">Set up your profile to get personalized recommendations</p>
      </div>

      <form id="signup-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div class="form-section">
          <label for="name" class="form-label" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Full Name</label>
          <div class="input-container" style="position: relative;">
            <span class="material-icons" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.2rem;">person</span>
            <input type="text" id="name" required placeholder="Enter your full name" style="padding-left: 2.8rem; width: 100%;" />
          </div>
        </div>

        <div class="form-section">
          <label for="email" class="form-label" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Email Address</label>
          <div class="input-container" style="position: relative;">
            <span class="material-icons" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.2rem;">email</span>
            <input type="email" id="email" required placeholder="Enter your email" style="padding-left: 2.8rem; width: 100%;" />
          </div>
        </div>

        <div class="form-section">
          <label for="password" class="form-label" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Password</label>
          <div class="input-container" style="position: relative;">
            <span class="material-icons" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.2rem;">lock</span>
            <input type="password" id="password" required placeholder="Enter your password" style="padding-left: 2.8rem; width: 100%;" />
          </div>
        </div>

        <div class="form-section">
          <label for="completedCourses" class="form-label" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Completed Courses</label>
          <input type="text" id="completedCourses" placeholder="e.g., Intro to CS, Calculus I" style="width: 100%;" />
          <p class="field-hint" style="font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem;">Comma separated list of courses you've completed</p>
        </div>

        <div class="form-section">
          <label for="interests" class="form-label" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Your Interests</label>
          <input type="text" id="interests" placeholder="e.g., AI, Web Development, Data Science" style="width: 100%;" />
          <p class="field-hint" style="font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem;">Comma separated list of your academic interests</p>
        </div>

        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
          Create Account
        </button>
        <div id="message" class="status" style="text-align: center; min-height: 24px;"></div>
      </form>

      <div class="auth-footer" style="text-align: center; border-top: 1px solid var(--border); padding-top: 1.5rem;">
        <p style="margin: 0; font-size: 0.9rem; color: var(--muted);">
          Already have an account? <a href="./login.html" style="font-weight: 600;">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/signup.js"></script>
</body>
</html>
