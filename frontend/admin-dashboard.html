<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Elective Hub</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body class="admin-page" style="background: var(--bg); overflow: hidden;">
  <div class="admin-layout" style="display: grid; grid-template-columns: 280px 1fr; height: 100vh;">
    
    <aside class="admin-sidebar" style="background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; backdrop-filter: var(--glass-blur);">
      <div class="sidebar-header" style="margin-bottom: 2rem;">
        <div class="sidebar-brand" style="display: flex; align-items: center; gap: 0.8rem;">
          <div class="brand-icon" style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--primary)); color: white; display: grid; place-items: center;">
            <span class="material-icons">admin_panel_settings</span>
          </div>
          <div class="brand-text">
            <h2 style="margin: 0; font-size: 1.2rem; font-family: 'Outfit', sans-serif;">Elective Hub</h2>
            <p style="margin: 0; font-size: 0.8rem; color: var(--muted);">Admin Dashboard</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <a class="nav-item active" href="#dashboard" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), transparent); color: var(--accent); font-weight: 600; text-decoration: none; border: 1px solid var(--border);">
          <span class="material-icons">dashboard</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" href="./courses.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; color: var(--muted); font-weight: 500; text-decoration: none; transition: 0.2s;">
          <span class="material-icons">menu_book</span>
          <span>Course Catalog</span>
        </a>
      </nav>

      <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto; border-top: 1px solid var(--border); padding-top: 1.5rem;">
        <button id="theme-toggle" class="sidebar-action" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: 0.2s;">
          <span class="material-icons">dark_mode</span>
          <span>Toggle Theme</span>
        </button>
        <button id="logout" class="sidebar-action danger" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.2); color: var(--danger); font-weight: 600; cursor: pointer; transition: 0.2s;">
          <span class="material-icons">logout</span>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="admin-main" style="overflow-y: auto; padding: 2rem 3rem;">
      <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
        <div>
          <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">System Overview</h1>
          <p class="muted" style="font-size: 1.1rem; margin: 0;">Monitor your elective recommendation system in real-time</p>
        </div>
        <div class="header-controls" style="display: flex; gap: 1rem;">
          <button class="icon-btn" style="width: 44px; height: 44px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border); cursor: pointer; display: grid; place-items: center; color: var(--text);">
            <span class="material-icons">refresh</span>
          </button>
          <button class="icon-btn" style="width: 44px; height: 44px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border); cursor: pointer; display: grid; place-items: center; color: var(--text);">
            <span class="material-icons">settings</span>
          </button>
        </div>
      </div>

      <div class="admin-content" style="display: flex; flex-direction: column; gap: 2rem;">
        
        <section class="stat-cards">
          <div id="analytics" class="stat-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem;">
            <!-- Analytics rendered by JS -->
          </div>
        </section>

        <div class="admin-panels" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
          
          <section class="card form-section" style="padding: 2rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
              <span class="material-icons" style="color: var(--primary);">library_add</span>
              <h3 style="margin: 0; font-size: 1.3rem;">Add New Course</h3>
            </div>
            <form id="course-form" class="form-grid" style="display: flex; flex-direction: column; gap: 1rem;">
              <input type="text" id="name" placeholder="Course Name" required />
              <input type="text" id="category" placeholder="Category" required />
              <select id="difficultyLevel" required style="padding: 0.8rem; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);">
                <option value="">Select Difficulty</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
              </select>
              <input type="text" id="prerequisites" placeholder="Prerequisites (comma separated)" />
              <textarea id="description" placeholder="Course Description" required style="min-height: 120px;"></textarea>
              <button class="btn btn-primary" type="submit" style="margin-top: 0.5rem; padding: 1rem;">
                <span class="material-icons">add</span> Publish Course
              </button>
            </form>
            <p id="course-message" class="status" style="margin-top: 1rem; text-align: center; min-height: 24px;"></p>
          </section>

          <section class="card students-section" style="padding: 2rem; display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
              <span class="material-icons" style="color: var(--accent);">group</span>
              <h3 style="margin: 0; font-size: 1.3rem;">Registered Students</h3>
            </div>
            <div id="students" class="students-list" style="display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; max-height: 500px; padding-right: 0.5rem;">
              <!-- Students list injected by JS -->
            </div>
          </section>

        </div>
      </div>
    </main>
  </div>

  <style>
    /* Styling JS injected elements */
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .stat-label { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; }
    .stat-value { font-size: 2.5rem; font-weight: 800; color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; }
    
    .student-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 1.25rem;
      transition: 0.2s;
    }
    .student-card:hover { transform: translateX(4px); border-color: var(--primary); }
    .student-card h4 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .student-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .chip {
      background: rgba(6, 182, 212, 0.1);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
      margin: 0.2rem 0.2rem 0 0;
    }
  </style>

  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/admin-dashboard.js"></script>
</body>
</html>
