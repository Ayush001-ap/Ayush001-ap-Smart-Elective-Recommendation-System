<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | Elective Hub</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body class="student-page" style="background: var(--bg); overflow: hidden;">
  <div class="student-layout" style="display: grid; grid-template-columns: 280px 1fr; height: 100vh;">
    
    <aside class="student-sidebar" style="background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; backdrop-filter: var(--glass-blur);">
      <div class="sidebar-header" style="margin-bottom: 2rem;">
        <div class="sidebar-brand" style="display: flex; align-items: center; gap: 0.8rem;">
          <div class="brand-icon" style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; display: grid; place-items: center;">
            <span class="material-icons">school</span>
          </div>
          <div class="brand-text">
            <h2 style="margin: 0; font-size: 1.2rem; font-family: 'Outfit', sans-serif;">Elective Hub</h2>
            <p style="margin: 0; font-size: 0.8rem; color: var(--muted);">Student Portal</p>
          </div>
        </div>
      </div>

      <div class="student-profile-card" style="background: rgba(79, 70, 229, 0.05); border: 1px solid rgba(79, 70, 229, 0.1); border-radius: 12px; padding: 1rem; margin-bottom: 2rem;">
        <h4 style="margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);">Welcome back</h4>
        <p id="student-name" style="font-weight: 700; margin: 0.25rem 0 0; color: var(--text); font-size: 1.1rem;">Student</p>
      </div>

      <nav class="sidebar-nav" style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
        <a class="nav-item active" href="#recommendations" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), transparent); color: var(--primary); font-weight: 600; text-decoration: none; border: 1px solid var(--border);">
          <span class="material-icons">auto_awesome</span>
          <span>Recommendations</span>
        </a>
        <a class="nav-item" href="./courses.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; color: var(--muted); font-weight: 500; text-decoration: none; transition: 0.2s;">
          <span class="material-icons">menu_book</span>
          <span>All Courses</span>
        </a>
      </nav>

      <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto; border-top: 1px solid var(--border); padding-top: 1.5rem;">
        <button id="theme-toggle" class="sidebar-action" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: 0.2s;">
          <span class="material-icons">dark_mode</span>
          <span>Toggle Theme</span>
        </button>
        <button id="logout" class="sidebar-action danger" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-radius: 10px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.2); color: var(--danger); font-weight: 600; cursor: pointer; transition: 0.2s;">
          <span class="material-icons">logout</span>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="student-main" style="overflow-y: auto; padding: 2rem 3rem;">
      <div class="student-header" style="margin-bottom: 2.5rem;">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Your Elective Recommendations</h1>
        <p class="muted" style="font-size: 1.1rem;">Discover courses tailored to your interests and academic progress</p>
      </div>

      <div class="student-content" style="display: flex; flex-direction: column; gap: 2rem;">
        
        <section class="profile-section card" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; padding: 2rem;">
          <div class="profile-item" style="background: rgba(0,0,0,0.02); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span class="material-icons" style="color: var(--accent);">psychology</span>
                <span class="profile-label" style="font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; color: var(--muted);">Your Interests</span>
              </div>
              <button id="edit-interests-btn" style="background: transparent; border: none; color: var(--primary); display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;">
                <span class="material-icons" style="font-size: 1rem;">edit</span> Edit
              </button>
            </div>
            <div id="interests-display">
              <p id="interests" class="profile-value" style="font-weight: 500; font-size: 1.1rem; margin: 0; line-height: 1.6;"></p>
            </div>
            <div id="interests-edit" style="display: none; flex-direction: column; gap: 0.75rem;">
              <input type="text" id="interests-input" style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);" placeholder="e.g. AI, Web Development" />
              <div style="display: flex; gap: 0.5rem;">
                <button id="save-interests-btn" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Save</button>
                <button id="cancel-interests-btn" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: transparent; border: 1px solid var(--border); color: var(--text);">Cancel</button>
              </div>
            </div>
          </div>
          
          <div class="profile-item" style="background: rgba(0,0,0,0.02); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border);">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
              <span class="material-icons" style="color: var(--success);">task_alt</span>
              <span class="profile-label" style="font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; color: var(--muted);">Completed Courses</span>
            </div>
            <p id="completed" class="profile-value" style="font-weight: 500; font-size: 1.1rem; margin: 0; line-height: 1.6;"></p>
          </div>
        </section>

        <section class="recommendations-section">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <h3 style="font-size: 1.5rem; margin: 0;">Recommended For You</h3>
          </div>
          <div id="recommendations" class="recommendations-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
            <!-- Rendered via JS -->
          </div>
        </section>
      </div>
    </main>
  </div>

  <style>
    /* Add hover states for JS injected cards in dashboard */
    .recommendation-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }
    .recommendation-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1);
      border-color: var(--primary);
    }
    .chip {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
      margin: 0.25rem;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }
    .eligible { color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 0.25rem; margin-top: 1rem;}
    .eligible::before { content: "check_circle"; font-family: 'Material Icons'; font-size: 1.2rem; }
    .not-eligible { color: var(--danger); font-weight: 600; display: flex; align-items: center; gap: 0.25rem; margin-top: 1rem; }
    .not-eligible::before { content: "cancel"; font-family: 'Material Icons'; font-size: 1.2rem; }
  </style>

  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/student-dashboard.js"></script>
</body>
</html>
